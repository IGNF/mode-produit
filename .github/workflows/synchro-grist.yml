name: Synchroniser les données Grist

# Toutes les 10 minutes, relit le document Grist « Fiches produits ». Si les
# données ont changé (textes, équipes ou images), commite src/data/produits.json
# et l'empreinte des images, puis déclenche le déploiement sur ce nouveau commit.
#
# Pourquoi passer par un commit : GitHub Pages identifie chaque déploiement par
# le SHA du commit (pages_build_version = GITHUB_SHA, non modifiable dans
# actions/deploy-pages). Redéployer plusieurs fois le même commit est souvent
# ignoré en silence : le déploiement affiche « success » mais le site continue
# de servir l'ancienne version. Un commit par changement de données garantit
# que chaque déploiement porte un SHA neuf.

on:
  schedule:
    # Minutes décalées de :00 (heure de pointe des tâches planifiées GitHub,
    # qui retarde ou saute alors des exécutions).
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write # commiter les données
  actions: write # déclencher le workflow de déploiement

concurrency:
  group: synchro-grist
  cancel-in-progress: false

jobs:
  synchro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pour pouvoir se rebaser sur main avant le push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Lire le Grist
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          GRIST_DOC_ID: toCYiKQga5KP
          GRIST_TABLE: Produits
        run: |
          python scripts/grist_to_json.py src/data/produits.json
          python scripts/empreinte_grist.py src/data/empreinte-grist.txt

      - name: Commiter et déployer si les données ont changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- src/data)" ]; then
            echo "Aucun changement dans le Grist : pas de déploiement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/produits.json src/data/empreinte-grist.txt
          git commit -m "Données Grist du $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          # main a pu avancer pendant la lecture du Grist : on se replace dessus.
          git pull --rebase origin main
          git push origin HEAD:main
          # Un push fait avec le jeton du workflow ne déclenche pas d'autre
          # workflow : on lance le déploiement explicitement, sur le nouveau commit.
          gh workflow run deploy.yml --ref main
